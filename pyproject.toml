[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htrcv"
version = "1.0.0"
description = "Visão computacional para reconhecimento de texto manuscrito em documentos históricos"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pillow>=11,<14",
  "opencv-python-headless>=4.10,<4.11",
  "pyyaml>=6,<7",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
htr = [
  "kraken==5.3.0",
  "torch==2.4.1",
  "torchvision==0.19.1",
  "torchmetrics==1.6.1",
  "shapely==2.0.7",
  "opencv-python-headless==4.10.0.84",
  "pillow==11.0.0",
]
figuras = ["matplotlib>=3.8"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
htrcv = "htrcv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
