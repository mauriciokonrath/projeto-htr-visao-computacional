# Parâmetros da segmentação clássica (E1).
seed: 42
classical:
  clahe: true
  clip_limit: 2.0
  deskew: true
  max_angle: 15.0
  min_hough_lines: 3
  min_confidence: 0.5
  threshold: adaptive
  block_size: 51
  threshold_c: 15.0
  denoise: false
  morphology: true
  grouping_width_ratio: 0.020
  grouping_height_ratio: 0.001
  min_area_ratio: 0.00003
  min_width_ratio: 0.015
  min_aspect: 2.0
  split_tall_components: true
  line_height_ratio: 0.015

